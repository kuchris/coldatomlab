[project]
name = "coldatomlab"
version = "0.2.0"
description = "A local virtual laboratory for condensate expansion and interference"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.51,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
